name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: ''
      draft:
        description: 'Create as a draft release'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Release Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine Tag and Version
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          # Strip leading 'v' for pure version string
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Release tag: $TAG (version: $VERSION)"

      - name: Setup Signing Keystore
        id: setup-keystore
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/release-upload.jks"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using custom release keystore from repository secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS || 'upload' }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No KEYSTORE_BASE64 secret found. Creating self-signed release keystore for GitHub distribution..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "ayneReleaseKeyPass" \
              -keypass "ayneReleaseKeyPass" \
              -dname "CN=Ayne, OU=Mobile, O=Ayne App, L=Addis Ababa, C=ET"

            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "STORE_PASSWORD=ayneReleaseKeyPass" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
            echo "KEY_PASSWORD=ayneReleaseKeyPass" >> $GITHUB_ENV
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK and App Bundle (AAB)
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare Release Artifacts
        id: artifacts
        run: |
          mkdir -p release-artifacts

          # Copy and rename APK
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-artifacts/ayne-${{ env.TAG }}.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release-artifacts/ayne-${{ env.TAG }}-unsigned.apk
          fi

          # Copy and rename AAB
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab release-artifacts/ayne-${{ env.TAG }}.aab
          fi

          # Generate SHA-256 Checksums for integrity verification
          cd release-artifacts
          sha256sum * > checksums.txt
          cat checksums.txt
          cd ..

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: ayne-release-${{ env.TAG }}
          path: release-artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
